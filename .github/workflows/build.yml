name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest run per branch is worth keeping; older ones waste minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK location is written as `local.properties`, which is
      # git-ignored. The runner image already has the SDK, so this points at it
      # rather than downloading one.
      - name: Locate the Android SDK
        id: sdk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "sdk_dir=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Cache the Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.sdk_dir }}
          key: sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: sdk-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-configuration-cache lintDebug

      - name: Assemble debug
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Release
    # A release is only meaningful for a tag, and only from the default branch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate the Android SDK
        id: sdk
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "sdk_dir=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      # The keystore is supplied base64-encoded so it never exists in the
      # repository. `TODAY_STORE_FILE` points at the path written here.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::warning::No signing key configured; the release will be unsigned."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/release.jks"
          echo "Signing with the repository key."

      - name: Assemble release
        env:
          TODAY_STORE_FILE: ${{ runner.temp }}/keys/release.jks
          TODAY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TODAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TODAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache assembleRelease

      # Publishing unsigned is a real outcome, not a failure: a fork or a
      # misconfigured secret should not fail the whole pipeline.
      - name: Collect release artifacts
        id: collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt dist/ 2>/dev/null || true
          ls -1 dist || true

      - name: Publish the release
        if: hashFiles('dist/*.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Today

            Offline, encrypted, immutable journal for Android.

            - Minimum Android 8.0 (API 26)
            - No account, no network permission, no analytics
            - Entries are sealed the moment the day rolls over
